databaseChangeLog:
  - changeSet:
      id: 1
      author: artyom
      changes:
        - createTable:
            tableName: sellers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: contact_info
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: registration_date
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: seller_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: payment_type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_date
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: seller_id
            constraintName: fk_transactions_seller
            referencedTableName: sellers
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: RESTRICT